services:
  # ------------------------------------------------
  # 1. MongoDB Persistent Database
  # ------------------------------------------------
  mongo:
    image: mongo:7
    container_name: auditoreserve-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - auditoreserve-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------
  # 2. Redis In-Memory Cache & Message Broker
  # ------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: auditoreserve-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - auditoreserve-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ------------------------------------------------
  # 3. Node.js Express API & WebSocket Server
  # ------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: auditoreserve-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/auditoreserve
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - FRONTEND_URL=http://localhost
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    networks:
      - auditoreserve-network

  # ------------------------------------------------
  # 4. React Vite Client & Nginx Reverse Proxy
  # ------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_SOCKET_URL: ""
    container_name: auditoreserve-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - auditoreserve-network

volumes:
  mongo_data:
    driver: local
  redis_data:
    driver: local

networks:
  auditoreserve-network:
    driver: bridge
