services:
  # ---------------------------------------------------
  # Express Backend API Server
  # ---------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auditorium_api
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env

  # ---------------------------------------------------
  # Background Worker (BullMQ Queues)
  # ---------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auditorium_worker
    restart: unless-stopped
    command: ["npm", "run", "start:worker"]
    env_file:
      - .env
